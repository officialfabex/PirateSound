  :root {
    --bg: #0b0612;
    --glass-bg: rgba(255, 255, 255, 0.045);
    --glass-border: rgba(255, 255, 255, 0.10);
    --glass-highlight: rgba(255, 255, 255, 0.22);
    --text: #f2f2f4;
    --text-dim: rgba(242, 242, 244, 0.5);
    --text-dimmer: rgba(242, 242, 244, 0.28);
    --accent: #a855f7;
    --accent-slow: #8b5cf6;
    --accent-fast: #d946ef;
    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    overflow: hidden; height: 100vh; position: relative; -webkit-font-smoothing: antialiased;
  }

  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .glow {
    position: absolute; width: 640px; height: 640px; border-radius: 50%; 
    filter: blur(140px); opacity: 0.16; top: -220px; left: -160px; 
    background: radial-gradient(circle, #a855f7, transparent 70%); 
    animation: drift 34s ease-in-out infinite alternate;
    transform: translateZ(0);
  }
  .glow.b {
    background: radial-gradient(circle, #5e8bff, transparent 70%); 
    top: auto; bottom: -240px; left: auto; right: -180px; animation-duration: 40s;
  }
  @keyframes drift { 0% { transform: translate(0, 0) translateZ(0); } 100% { transform: translate(70px, 50px) translateZ(0); } }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(25px) saturate(150%);
    -webkit-backdrop-filter: blur(25px) saturate(150%);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 6px 24px rgba(0,0,0,0.4);
    border-radius: var(--radius-lg);
    transform: translateZ(0);
  }

  .app {
    position: relative; z-index: 1; display: grid; grid-template-columns: 240px 1fr; gap: 10px;
    height: calc(100vh - 92px); padding: 10px 10px 0 10px;
  }

  /* Sidebar */
  .sidebar { padding: 22px 16px; display: flex; flex-direction: column; gap: 28px; overflow-y: auto; }
  
  .brand-wrap { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; color: var(--text); opacity: 0.9; }
  .brand svg { width: 22px; height: 22px; color: var(--accent); }

  .info-badge-btn {
    all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center; color: var(--text-dim);
    font-size: 11px; font-weight: 600; transition: background 0.2s, color 0.2s, transform 0.1s;
  }
  .info-badge-btn:hover { background: rgba(255,255,255,0.15); color: var(--text); }
  .info-badge-btn:active { transform: scale(0.9); }

  .group { display: flex; flex-direction: column; gap: 10px; }
  .group-title { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dimmer); margin-left: 4px; }

  .segmented {
    position: relative; display: flex; background: rgba(255,255,255,0.05); 
    border: 1px solid rgba(255,255,255,0.08); border-radius: 11px; padding: 2px; gap: 1px;
  }
  .segmented .seg-highlight {
    position: absolute; top: 2px; bottom: 2px; border-radius: 9px; 
    background: rgba(255,255,255,0.12); z-index: 0;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .segmented button {
    all: unset; position: relative; z-index: 1; cursor: pointer; flex: 1; 
    text-align: center; padding: 7px 6px; font-size: 11px; font-weight: 500; 
    color: var(--text-dimmer); transition: color 0.2s ease;
  }
  .segmented button.active { color: var(--text); }

  .quiet-io { display: flex; gap: 5px; align-items: center; }
  .quiet-io input {
    flex: 1; min-width: 0; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.08);
    color: var(--text); font-size: 11px; padding: 8px 10px; border-radius: 8px; outline: none; 
    font-family: var(--font); transition: border-color 0.2s, background 0.2s;
  }
  .quiet-io input::placeholder { color: var(--text-dimmer); }
  .quiet-io input:focus { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.25); }
  
  .icon-btn {
    all: unset; cursor: pointer; width: 30px; height: 30px; flex-shrink: 0; 
    display: flex; align-items: center; justify-content: center; color: var(--text-dim); 
    border-radius: 8px; background: rgba(255,255,255,0.045);
    transition: color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .icon-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* Main */
  .main { display: flex; flex-direction: column; min-height: 0; }
  .topbar { display: flex; align-items: center; padding: 8px 14px; margin-bottom: 10px; flex-shrink: 0; }
  .search-wrap {
    flex: 1; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); 
    border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 9px 16px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .search-wrap:focus-within { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
  .search-wrap svg { width: 14px; height: 14px; color: var(--text-dimmer); flex-shrink: 0; }
  .search-wrap input { all: unset; flex: 1; color: var(--text); font-size: 13px; font-family: var(--font); }
  .search-wrap input::placeholder { color: var(--text-dimmer); }

  .content { flex: 1; overflow-y: auto; padding: 0 14px 20px 14px; }
  .content::-webkit-scrollbar { width: 7px; }
  .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 7px; }

  .panel { padding: 14px 14px 6px 14px; }
  .panel-head { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 8px; padding: 0 4px; }
  .panel-head .count { font-size: 11px; color: var(--text-dimmer); font-weight: 500; }

  .track-row {
    display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 14px;
    padding: 10px 12px; border-radius: 12px; cursor: pointer; 
    transition: background 0.15s ease, transform 0.1s ease;
    opacity: 1;
  }
  .track-row:hover { background: rgba(255,255,255,0.06); }
  .track-row:active { transform: scale(0.99); }
  .track-row.playing { background: rgba(168,85,247,0.1); }
  
  .t-idx { color: var(--text-dimmer); font-size: 13px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }
  .t-idx .bars { display: none; gap: 2.5px; align-items: flex-end; height: 12px; justify-content: center; }
  .track-row.playing .t-idx .bars { display: flex; }
  .track-row.playing .t-idx .num { display: none; }
  .bars span { width: 2.5px; background: var(--accent); border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
  .bars span:nth-child(1) { height: 5px; animation-delay: 0s; }
  .bars span:nth-child(2) { height: 11px; animation-delay: 0.2s; }
  .bars span:nth-child(3) { height: 7px; animation-delay: 0.4s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

  .t-meta { min-width: 0; }
  .t-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-dur { color: var(--text-dimmer); font-size: 12px; font-variant-numeric: tabular-nums; }

  .empty-state { padding: 40px 10px; text-align: center; color: var(--text-dimmer); font-size: 13px; font-weight: 500; }

  /* Player bar */
  .player {
    position: relative; z-index: 2; height: 82px; margin: 10px;
    display: grid; grid-template-columns: 1fr minmax(340px, 580px) 1fr; align-items: center; padding: 0 20px; gap: 12px;
  }
  .p-left { display: flex; align-items: center; min-width: 0; }
  .p-meta { min-width: 0; width: 100%; }
  .p-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .p-center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .p-controls { display: flex; align-items: center; gap: 20px; }
  .ctrl-btn { all: unset; cursor: pointer; color: var(--text-dim); display: flex; align-items: center; justify-content: center; transition: color 0.2s ease, transform 0.1s ease; }
  .ctrl-btn:hover { color: var(--text); }
  .ctrl-btn:active { transform: scale(0.85); }
  .ctrl-btn svg { width: 16px; height: 16px; }
  
  .play-btn {
    width: 34px; height: 34px; border-radius: 50%; background: var(--text); color: #000; 
    display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease, background 0.2s ease;
  }
  .play-btn:hover { transform: scale(1.08); background: #fff; }
  .play-btn:active { transform: scale(0.95); }
  .play-btn svg { width: 15px; height: 15px; }

  .p-progress { display: flex; align-items: center; gap: 10px; width: 100%; }
  .p-time { font-size: 10.5px; font-weight: 500; color: var(--text-dimmer); width: 34px; font-variant-numeric: tabular-nums; }
  .p-time.right { text-align: right; }
  .bar-track { flex: 1; height: 10px; touch-action: none; user-select: none; border-radius: 4px; background: rgba(255,255,255,0.13); position: relative; cursor: pointer; }
  .bar-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px; background: var(--text); width: 0%; transition: background 0.3s ease; }
  .bar-fill.slow { background: var(--accent-slow); }
  .bar-fill.normal { background: var(--accent); }
  .bar-fill.fast { background: var(--accent-fast); }
  .bar-knob {
    position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; 
    background: #fff; transform: translate(-50%, -50%); left: 0%; opacity: 0; transition: opacity 0.2s ease, transform 0.1s;
  }
  .bar-track:hover .bar-knob, .bar-track:focus-within .bar-knob { opacity: 1; }
  .bar-track:active .bar-knob { transform: translate(-50%, -50%) scale(1.3); }
  .bar-track:focus { outline: 2px solid rgba(168,85,247,.45); outline-offset: 3px; }

  .p-right { display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
  .p-right .segmented { width: 170px; }
  .vol-wrap { display: flex; align-items: center; gap: 8px; width: 90px; }
  .vol-wrap svg { width: 14px; height: 14px; color: var(--text-dimmer); flex-shrink: 0; }
  
  input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #fff; cursor: pointer; transition: transform 0.1s; }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }

  /* Modal Info Overlay */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-card {
    width: 320px; max-width: 100%; padding: 24px; text-align: center;
    display: flex; flex-direction: column; gap: 16px;
    transform: scale(0.95); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .modal-overlay.active .modal-card { transform: scale(1); }
  .modal-card h3 { margin: 0; font-size: 18px; font-weight: 600; color: var(--text); }
  .modal-card p { margin: 0; font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .modal-card .version-tag { font-size: 12px; font-weight: 600; color: var(--accent); background: rgba(168,85,247,0.1); padding: 4px 10px; border-radius: 20px; align-self: center; }
  .modal-close-btn {
    all: unset; cursor: pointer; margin-top: 4px; background: rgba(255,255,255,0.08);
    color: var(--text); font-size: 13px; font-weight: 500; padding: 10px; border-radius: 10px;
    transition: background 0.2s;
  }
  .modal-close-btn:hover { background: rgba(255,255,255,0.15); }

  /* Debug */
  .debug-toggle {
    position: fixed; bottom: 100px; right: 16px; z-index: 50; width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-dimmer);
    transition: color 0.15s ease, background 0.2s;
  }
  .debug-toggle:hover { color: var(--text); background: rgba(255,255,255,0.08); }
  .debug-toggle svg { width: 15px; height: 15px; }
  .debug-toggle .ping { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  
  .debug-panel {
    position: fixed; bottom: 142px; right: 16px; z-index: 50; width: 380px; max-width: calc(100vw - 32px); height: 320px;
    display: flex; flex-direction: column; overflow: hidden; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .debug-panel.hidden { opacity: 0; pointer-events: none; transform: translateY(10px) scale(0.98); }
  .debug-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
  .debug-header b { font-size: 12px; font-weight: 600; color: var(--text-dim); }
  .debug-header .hbtns { display: flex; gap: 6px; }
  .debug-header button { all: unset; cursor: pointer; font-size: 11px; color: var(--text-dimmer); padding: 5px 8px; border-radius: 6px; transition: background 0.2s, color 0.2s;}
  .debug-header button:hover { color: var(--text); background: rgba(255,255,255,0.08); }
  .debug-log { flex: 1; overflow-y: auto; padding: 10px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; line-height: 1.6; }
  .debug-log::-webkit-scrollbar { width: 5px; }
  .debug-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 6px; }
  .log-line { white-space: pre-wrap; word-break: break-word; margin-bottom: 3px; }
  .log-time { color: var(--text-dimmer); margin-right: 6px; }
  .log-info { color: #8ecbff; }
  .log-ok { color: #c084fc; }
  .log-warn { color: #e0b866; }
  .log-err { color: #f08a7e; }

  .app-brand { display:flex; align-items:center; gap:8px; min-width:0; }
  .app-logo { width:34px; height:34px; border-radius:10px; object-fit:cover; flex:0 0 auto; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); }
  .brand-copy { display:flex; align-items:center; gap:7px; min-width:0; }
  .app-name { font-size:11px; font-weight:700; white-space:nowrap; opacity:.85; }
  .quick-btn { all:unset; cursor:pointer; display:flex; align-items:center; gap:7px; min-width:145px; padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08); color:var(--text); transition:background .15s,border-color .15s,transform .1s; }
  .quick-btn:hover { background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.14); }
  .quick-btn:active { transform:scale(.98); }
  .quick-btn svg { width:15px; height:15px; flex:0 0 auto; color:var(--text-dim); }
  .quick-btn span { font-size:11px; font-weight:600; white-space:nowrap; }
  .quick-btn b { margin-left:auto; font-size:10px; font-weight:500; color:var(--text-dimmer); white-space:nowrap; }
  .utility-btn { all:unset; cursor:pointer; position:relative; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:9px; color:var(--text-dimmer); transition:background .15s,color .15s,transform .1s; }
  .utility-btn:hover { background:rgba(255,255,255,.08); color:var(--text); }
  .utility-btn:active { transform:scale(.92); }
  .utility-btn svg { width:15px; height:15px; }
  .modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:2px; }
  .modal-secondary,.modal-primary { all:unset; cursor:pointer; text-align:center; padding:10px; border-radius:10px; font-size:12px; font-weight:600; }
  .modal-secondary { background:rgba(255,255,255,.07); color:var(--text); }
  .modal-primary { background:var(--text); color:#000; }
  .choice-list { display:grid; gap:7px; width:100%; }
  .choice-btn { all:unset; cursor:pointer; padding:10px 12px; border-radius:10px; display:flex; justify-content:space-between; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.07); font-size:12px; font-weight:600; }
  .choice-btn span { color:var(--text-dimmer); font-weight:500; }
  .choice-btn.active { background:rgba(168,85,247,.12); border-color:rgba(168,85,247,.28); }
  .source-fields { display:grid; gap:8px; width:100%; text-align:left; }
  .source-fields label { display:grid; gap:5px; font-size:10px; color:var(--text-dimmer); }
  .source-fields input { width:100%; border-radius:9px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.045); color:var(--text); padding:9px 10px; outline:none; font:inherit; font-size:12px; }
  .source-fields input:focus { border-color:rgba(255,255,255,.2); }

  /* Mobile Responsive Adjustments */
  @media (max-width: 900px) {
    .app { display:flex; flex-direction:column; gap:8px; padding:8px; height:calc(100dvh - 128px); min-height:0; }
    .sidebar { flex:0 0 auto; padding:9px 10px; overflow:visible; }
    .mode-group { width:100%; }
    .group-title { display:none; }
    .main { min-height:0; }
    .topbar { margin-bottom:8px; padding:7px 10px; }
    .content { padding:0 0 12px; min-width:0; }
    .panel { padding:10px 8px 5px; }
    .track-row { grid-template-columns:32px minmax(0,1fr) auto; gap:10px; padding:10px 8px; }
    .t-title { font-size:13px; }
    .player { position:relative; height:auto; min-height:112px; margin:8px; padding:10px 12px; grid-template-columns:1fr; gap:9px; }
    .p-right { order:1; justify-content:flex-start; flex-wrap:wrap; gap:6px; }
    .p-center { order:2; width:100%; }
    .p-left { display:none; }
    .app-brand { margin-right:auto; }
    .quick-btn { min-width:0; flex:1 1 140px; }
    .vol-wrap { width:90px; }
    .debug-panel { width:calc(100vw - 20px); right:10px; bottom:120px; height:min(320px,45vh); }
  }
  @media (max-width: 520px) {
    .app { height:calc(100dvh - 122px); padding:6px; }
    .player { margin:6px; padding:9px 10px; }
    .quick-btn { flex-basis:125px; }
    .quick-btn span { font-size:10.5px; }
    .quick-btn b { font-size:9px; }
    .p-controls { gap:20px; }
    .p-progress { gap:7px; }
    .p-time { width:29px; font-size:9px; }
  }

/* Final mobile + glass cleanup */
:root {
  --glass-bg: rgba(17, 17, 18, 0.88);
  --glass-bg-strong: rgba(20, 20, 21, 0.94);
}
.bg .glow { display:none; } /* prevent rainbow/colored bleed through translucent glass */

.glass {
  background: var(--glass-bg);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.06),
    0 4px 18px rgba(0,0,0,0.28);
}

.content {
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
  padding: 0 8px 14px;
}
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); }

.player {
  position: relative;
  isolation: isolate;
  z-index: 4;
  background: var(--glass-bg-strong);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.sidebar, .topbar, .panel {
  background: rgba(18,18,19,0.94);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.brand-wrap {
  justify-content: flex-start;
}

@media (max-width: 820px) {

<script>
(function(){
  "use strict";

  /* =========================================================
     DEBUG LOGGER
  ==========================================================*/
  const debugLog = document.getElementById('debugLog');
  const debugPing = document.getElementById('debugPing');
  function ts(){
    const d = new Date();
    return d.toTimeString().slice(0,8) + '.' + String(d.getMilliseconds()).padStart(3,'0');
  }
  function log(msg, type){
    type = type || 'info';
    const line = document.createElement('div');
    line.className = 'log-line log-' + type;
    line.innerHTML = '<span class="log-time">['+ts()+']</span>' + msg;
    debugLog.appendChild(line);
    debugLog.scrollTop = debugLog.scrollHeight;
    try{ console.log('[debug]['+type+']', msg); }catch(e){}
    if(type === 'err') debugPing.style.background = '#f08a7e';
    else if(type === 'warn') debugPing.style.background = '#e0b866';
  }

  const debugToggle = document.getElementById('debugToggle');
  const debugPanel = document.getElementById('debugPanel');
  debugToggle.addEventListener('click', ()=>{
    debugPanel.classList.toggle('hidden');
    debugPing.style.background = 'transparent';
  });
  document.getElementById('debugClose').addEventListener('click', ()=> debugPanel.classList.add('hidden'));
  document.getElementById('debugClear').addEventListener('click', ()=> debugLog.innerHTML = '');

  log('PirateSound initialized.', 'info');

  /* =========================================================
     MODAL INFO TOGGLE
  ==========================================================*/
  const infoModal = document.getElementById('infoModal');
  document.getElementById('infoBtn').addEventListener('click', () => infoModal.classList.add('active'));
  document.getElementById('modalClose').addEventListener('click', () => infoModal.classList.remove('active'));
  infoModal.addEventListener('click', (e) => {
    if(e.target === infoModal) infoModal.classList.remove('active');
  });

  /* =========================================================
     GLOBAL STATE
  ==========================================================*/
  const state = {
    tracks: [],
    currentIndex: -1,
    isPlaying: false,
    mode: 'sequential',
    speed: 'normal',
    volume: 0.7,
    failedTrack: null,
    failedTrackAttempts: 0
  };

  const SPEED_RATES = { 'very-slow': 0.85, slow: 0.92, normal: 1.0, fast: 1.08, 'very-fast': 1.15 };


  /* =========================================================
     MOBILE / APK AUDIO COMPATIBILITY
     Single-file WebView friendly audio element + Media Session.
  ==========================================================*/
  const mobileAudio = document.createElement('audio');
  mobileAudio.id = 'mobileAudio';
  mobileAudio.preload = 'auto';
  mobileAudio.playsInline = true;
  mobileAudio.setAttribute('playsinline', '');
  mobileAudio.setAttribute('webkit-playsinline', '');
  mobileAudio.crossOrigin = 'anonymous';
  mobileAudio.style.display = 'none';
  document.body.appendChild(mobileAudio);

  function updateMediaSession(track, playing){
    if(!('mediaSession' in navigator) || !track) return;
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title || 'Untitled Track',
        artist: 'PirateSound',
        album: 'PirateSound',
        artwork: [{ src: new URL('PirateSound Logo.png', document.baseURI).href, sizes: '512x512', type: 'image/png' }]
      });
      navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
      const actions = {
        play: () => togglePlayPause(),
        pause: () => togglePlayPause(),
        previoustrack: () => prevTrack(),
        nexttrack: () => nextTrack(),
        seekbackward: () => {
          if(mobileAudio.duration) mobileAudio.currentTime = Math.max(0, mobileAudio.currentTime - 10);
        },
        seekforward: () => {
          if(mobileAudio.duration) mobileAudio.currentTime = Math.min(mobileAudio.duration, mobileAudio.currentTime + 10);
        }
      };
      Object.keys(actions).forEach(action => {
        try { navigator.mediaSession.setActionHandler(action, actions[action]); } catch(e) {}
      });
    }catch(e){}
  }

  mobileAudio.addEventListener('play', () => updateMediaSession(currentTrack(), true));
  mobileAudio.addEventListener('pause', () => updateMediaSession(currentTrack(), false));
  mobileAudio.addEventListener('ended', () => {
    if(currentTrack() && currentTrack().type === 'real') onTrackEnded();
  });
  mobileAudio.addEventListener('timeupdate', () => {
    if(currentTrack() && currentTrack().type === 'real'){
      updateProgressUI(mobileAudio.currentTime, mobileAudio.duration || 0);
    }
  });
  mobileAudio.addEventListener('loadedmetadata', () => {
    if(currentTrack() && currentTrack().type === 'real'){
      currentTrack().duration = mobileAudio.duration || 0;
      currentTrack().durationLoaded = true;
      updateProgressUI(mobileAudio.currentTime, mobileAudio.duration || 0);
    }
  });

  function savePlaybackState(){
    try{
      const t = currentTrack();
      if(!t) return;
      localStorage.setItem('piratesound.lastTrack', String(state.currentIndex));
      if(t.url) localStorage.setItem('piratesound.lastUrl', t.url);
      localStorage.setItem('piratesound.lastTime', String(
        t.type === 'real' ? (mobileAudio.currentTime || 0) : 0
      ));
    }catch(e){}
  }

  // Use pagehide only. beforeunload can prevent the browser's back/forward cache
  // and may make the page look like it is reloading when returning to it.
  window.addEventListener('pagehide', (event) => {
    savePlaybackState();
    log('Page hidden/pagehide. persisted=' + !!event.persisted, 'info');
  });
  document.addEventListener('visibilitychange', () => {
    // Never pause just because the page is hidden/minimized. The persistent
    // <audio> element + Media Session are intentionally kept alive.
    if(document.visibilityState === 'hidden') {
      savePlaybackState();
      if(state.isPlaying && audioCtx && audioCtx.state === 'suspended'){
        audioCtx.resume().catch(() => {});
      }
    } else if(document.visibilityState === 'visible') {
      if(state.isPlaying && audioCtx && audioCtx.state === 'suspended'){
        audioCtx.resume().catch(() => {});
      }
      if(state.isPlaying && realAudioEl && realAudioEl.paused){
        realAudioEl.play().catch(() => {});
      }
    }
  });


  window.addEventListener('pageshow', (event) => {
    log('Page shown. persisted=' + !!event.persisted, 'info');
    if(state.isPlaying && audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().catch(() => {});
    }
    if(state.isPlaying && realAudioEl && realAudioEl.paused && currentTrack() && currentTrack().type === 'real'){
      realAudioEl.play().catch(() => {});
    }
  });

  // Modern Page Lifecycle API: when supported, preserve the player while the
  // browser freezes the tab instead of treating it as a fresh navigation.
  document.addEventListener('freeze', () => {
    savePlaybackState();
    log('Browser froze the page; player state saved.', 'info');
  });
  document.addEventListener('resume', () => {
    log('Browser resumed the page.', 'info');
    if(state.isPlaying && audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().catch(() => {});
    }
  });

  /* =========================================================
     WEB AUDIO GRAPH
  ==========================================================*/
  let audioCtx = null;
  let masterGain, toneFilter;

  function ensureAudioGraph(){
    if(audioCtx) return;
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = state.volume;
      masterGain.connect(audioCtx.destination);

      toneFilter = audioCtx.createBiquadFilter();
      toneFilter.type = 'highshelf';
      toneFilter.frequency.value = 3000;
      toneFilter.gain.value = 0;

      toneFilter.connect(masterGain);

      log('Audio context created.', 'ok');
    }catch(e){
      log('Failed to create audio context: ' + e.message, 'err');
    }
  }

  function applySpeedFX(speed){
    if(!audioCtx || !toneFilter) return;
    const t = audioCtx.currentTime;
    if(speed === 'very-slow'){
      toneFilter.gain.linearRampToValueAtTime(-2.5, t+0.4);
    } else if(speed === 'slow'){
      toneFilter.gain.linearRampToValueAtTime(-1.2, t+0.4);
    } else if(speed === 'fast'){
      toneFilter.gain.linearRampToValueAtTime(1.4, t+0.4);
    } else if(speed === 'very-fast'){
      toneFilter.gain.linearRampToValueAtTime(3, t+0.4);
    } else {
      toneFilter.gain.linearRampToValueAtTime(0, t+0.4);
    }
  }

  /* =========================================================
     UTILS
  ==========================================================*/
  function hashCode(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (h<<5) - h + str.charCodeAt(i); h |= 0; }
    return Math.abs(h);
  }
  function fmtTime(sec){
    if(!isFinite(sec) || sec<0) sec = 0;
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m + ':' + String(s).padStart(2,'0');
  }
  function formatTitle(name){
    name = name.replace(/\.[^/.]+$/, '');
    name = name.replace(/[_\-]+/g,' ').trim();
    return name || 'Untitled Track';
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* =========================================================
     FETCHING TRACKS FROM GITHUB
  ==========================================================*/
  const AUDIO_EXT = /\.(mp3|wav|ogg|m4a|flac|aac)$/i;

  async function tryFetchJson(url){
    log('Request: ' + url, 'info');
    const res = await fetch(url, { headers:{ 'Accept':'application/vnd.github+json' } });
    log('Response ' + res.status + ' for ' + url, res.ok ? 'ok':'warn');
    if(!res.ok){
      const body = await res.text().catch(()=> '');
      throw new Error('HTTP ' + res.status + ' — ' + (body ? body.slice(0,180) : res.statusText));
    }
    return res.json();
  }

  async function fetchGithubTracks(owner, repo){
    log('Attempting to fetch repo: ' + owner + '/' + repo, 'info');

    let repoInfo;
    try{
      repoInfo = await tryFetchJson(`https://api.github.com/repos/${owner}/${repo}`);
    }catch(e){
      throw new Error('Repository not found (' + e.message + ')');
    }
    const branch = repoInfo.default_branch || 'main';
    log('Branch: ' + branch, 'info');

    let tree;
    try{
      tree = await tryFetchJson(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`);
    }catch(e){
      throw new Error('Failed to fetch file tree (' + e.message + ')');
    }

    const audioFiles = (tree.tree || []).filter(item => item.type === 'blob' && AUDIO_EXT.test(item.path));
    log('Audio files found: ' + audioFiles.length, audioFiles.length ? 'ok' : 'warn');

    if(!audioFiles.length){
      throw new Error('No audio files found in repository');
    }

    let parsed = audioFiles.map((f, i) => {
      const parts = f.path.split('/');
      const filename = parts[parts.length - 1];
      let cleanName = formatTitle(filename);
      
      let trackNum = i + 1;
      const numMatch = cleanName.match(/^(\d+)\.\s*(.*)/);
      if(numMatch){
        trackNum = parseInt(numMatch[1], 10);
        cleanName = numMatch[2] || cleanName;
      }

      const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/` +
        f.path.split('/').map(encodeURIComponent).join('/');
      return { 
        id: 'r'+i, 
        title: cleanName, 
        trackNum: trackNum, 
        orderNumber: numMatch ? parseInt(numMatch[1], 10) : Number.POSITIVE_INFINITY,
        path: f.path,
        type: 'real', 
        url: rawUrl, 
        durationLoaded: false, 
        duration: 0 
      };
    });

    // Stabilna kolejność: najpierw numery z nazw plików (01, 02, 10...),
    // potem naturalne sortowanie ścieżki dla plików bez numerów.
    parsed.sort((a, b) => {
      if(a.orderNumber !== b.orderNumber) return a.orderNumber - b.orderNumber;
      return String(a.path).localeCompare(String(b.path), undefined, {numeric:true, sensitivity:'base'});
    });
    parsed.forEach((t, i) => { if(!Number.isFinite(t.orderNumber)) t.trackNum = i + 1; });
    log('Final queue order: ' + parsed.map((t, i) => (i + 1) + ':' + t.title).join(' | '), 'info');

    return parsed;
  }

  /* =========================================================
     DURATION LOADING — FAST / FULL
     Load metadata for ALL tracks in parallel. Durations are cached
     separately so later visits can render them immediately.
  ==========================================================*/
  const durationAudioPool = new Map();

  function durationCacheKey(owner, repo){
    return 'piratesound.durationCache:' + owner + '/' + repo;
  }
  function readDurationCache(owner, repo){
    try { return JSON.parse(localStorage.getItem(durationCacheKey(owner, repo)) || '{}'); }
    catch(e){ return {}; }
  }
  function saveDurationCache(owner, repo, map){
    try { localStorage.setItem(durationCacheKey(owner, repo), JSON.stringify(map)); }
    catch(e){}
  }

  function applyCachedDurations(owner, repo, tracks){
    const cached = readDurationCache(owner, repo);
    let hits = 0;
    tracks.forEach(t => {
      const d = cached[t.url];
      if(isFinite(d) && d > 0){
        t.duration = d;
        t.durationLoaded = true;
        hits++;
      }
    });
    if(hits) log('Instant duration cache: ' + hits + '/' + tracks.length + ' tracks.', 'ok');
  }

  function updateTrackDurationUI(idx, duration){
    const row = document.getElementById('track-row-' + idx);
    const el = row && row.querySelector('.t-dur');
    if(el) el.textContent = fmtTime(duration);
  }

  function loadDurationForTrack(t, idx, owner, repo, durationCache){
    if(!t || t.type !== 'real' || t.durationLoaded || !t.url) return Promise.resolve();

    return new Promise(resolve => {
      const a = document.createElement('audio');
      a.preload = 'metadata';
      a.src = t.url;
      durationAudioPool.set(t.url, a); // keep the element alive until metadata arrives

      let done = false;
      const finish = (ok) => {
        if(done) return;
        done = true;
        if(ok && isFinite(a.duration) && a.duration > 0){
          t.duration = a.duration;
          t.durationLoaded = true;
          durationCache[t.url] = a.duration;
          updateTrackDurationUI(idx, a.duration);
        }
        durationAudioPool.delete(t.url);
        try { a.removeAttribute('src'); a.load(); } catch(e){}
        resolve();
      };

      a.addEventListener('loadedmetadata', () => finish(true), {once:true});
      a.addEventListener('durationchange', () => {
        if(isFinite(a.duration) && a.duration > 0) finish(true);
      });
      a.addEventListener('error', () => finish(false), {once:true});
      setTimeout(() => finish(false), 10000);
    });
  }

  async function loadAllDurations(owner, repo){
    const queue = state.tracks
      .map((t, idx) => ({t, idx}))
      .filter(({t}) => t.type === 'real' && !t.durationLoaded && t.url);
    if(!queue.length) return;

    log('Starting FULL duration preload: ' + queue.length + ' tracks in parallel.', 'info');
    const durationCache = readDurationCache(owner, repo);

    // Start every metadata request immediately. This is deliberately aggressive:
    // the user asked for everything to load as fast as possible.
    await Promise.all(queue.map(({t, idx}) => loadDurationForTrack(t, idx, owner, repo, durationCache)));
    saveDurationCache(owner, repo, durationCache);
    saveTrackCache(owner, repo, state.tracks);
    log('FULL duration preload finished: ' + state.tracks.filter(t => t.durationLoaded).length + '/' + state.tracks.length + '.', 'ok');
  }

  /* =========================================================
     PLAYBACK ENGINE
  ==========================================================*/
  let realAudioEl = null;
  let realSourceNode = null;
  let synthState = null;
  let playbackRequestToken = 0;

  function stopAllPlayback(invalidatePending = true){
    if(invalidatePending) playbackRequestToken++;
    if(realAudioEl){ try{ realAudioEl.pause(); }catch(e){} }
    if(synthState){
      synthState.activeOscillators.forEach(o => { try{ o.stop(); }catch(e){} });
      if(synthState.endTimer) clearTimeout(synthState.endTimer);
      if(synthState.rafId) cancelAnimationFrame(synthState.rafId);
      synthState = null;
    }
  }

  function connectRealAudioOnce(){
    if(realSourceNode) return;
    try{
      realSourceNode = audioCtx.createMediaElementSource(realAudioEl);
      realSourceNode.connect(toneFilter);
      log('Connected audio element to graph.', 'ok');
    }catch(e){
      log('Playing directly without graph (' + e.message + ')', 'warn');
      realAudioEl.volume = state.volume;
    }
  }

  let realLoadToken = 0;
  const MAX_TRACK_LOAD_ATTEMPTS = 3;
  const TRACK_LOAD_TIMEOUT_MS = 15000;

  function closeSongErrorModal(){
    const modal = document.getElementById('songErrorModal');
    if(modal) modal.classList.remove('active');
  }

  function showSongErrorModal(track, reason){
    const modal = document.getElementById('songErrorModal');
    const text = document.getElementById('songErrorText');
    if(!modal || !text) return;
    state.failedTrack = track || null;
    state.failedTrackAttempts = MAX_TRACK_LOAD_ATTEMPTS;
    text.textContent = (track ? '„' + track.title + '” — ' : '') +
      'nie udało się załadować po ' + MAX_TRACK_LOAD_ATTEMPTS + ' próbach.' +
      (reason ? ' ' + reason : '');
    modal.classList.add('active');
  }

  function cleanupAudioAttempt(audio, handlers){
    if(!audio || !handlers) return;
    try{ audio.removeEventListener('loadeddata', handlers.onLoaded); }catch(e){}
    try{ audio.removeEventListener('canplay', handlers.onLoaded); }catch(e){}
    try{ audio.removeEventListener('error', handlers.onError); }catch(e){}
    try{ audio.removeEventListener('abort', handlers.onAbort); }catch(e){}
    try{ audio.removeEventListener('stalled', handlers.onStalled); }catch(e){}
  }

  function loadRealTrackWithRetries(track, requestToken){
    if(!realAudioEl) realAudioEl = mobileAudio;
    const token = ++realLoadToken;
    return new Promise((resolve, reject) => {
      let attempt = 0, finished = false;
      const failAttempt = (reason) => {
        if(finished || token !== realLoadToken || requestToken !== playbackRequestToken) return;
        attempt++;
        log('Load failed ' + attempt + '/' + MAX_TRACK_LOAD_ATTEMPTS + ': ' + reason, 'warn');
        if(attempt >= MAX_TRACK_LOAD_ATTEMPTS){ finished=true; reject(new Error(reason)); return; }
        setTimeout(runAttempt, 300);
      };
      const runAttempt = () => {
        if(finished || token !== realLoadToken || requestToken !== playbackRequestToken) return;
        let settled=false, timeoutId=null;
        const handlers={};
        const cleanup=()=>{ if(timeoutId) clearTimeout(timeoutId); cleanupAudioAttempt(realAudioEl, handlers); };
        const succeed=()=>{ if(finished||settled||token!==realLoadToken||requestToken!==playbackRequestToken)return; settled=true;cleanup();finished=true;resolve(); };
        handlers.onLoaded=succeed;
        handlers.onError=()=>{ if(finished||settled)return; settled=true;cleanup(); const code=realAudioEl.error&&realAudioEl.error.code; const reason=code===2?'Network error.':code===3?'The file could not be decoded.':code===4?'The format is not supported.':'The audio file is unavailable.'; failAttempt(reason); };
        handlers.onAbort=()=>{ if(finished||settled)return; settled=true;cleanup();failAttempt('Ładowanie przerwane.'); };
        handlers.onStalled=()=>log('Audio stalled: '+track.title,'warn');
        realAudioEl.addEventListener('loadeddata',handlers.onLoaded,{once:true});
        realAudioEl.addEventListener('canplay',handlers.onLoaded,{once:true});
        realAudioEl.addEventListener('error',handlers.onError,{once:true});
        realAudioEl.addEventListener('abort',handlers.onAbort,{once:true});
        realAudioEl.addEventListener('stalled',handlers.onStalled);
        const url=attempt===0?track.url:track.url+(track.url.includes('?')?'&':'?')+'_ps_retry='+attempt;
        realAudioEl.preload='auto'; realAudioEl.src=url; realAudioEl.load();
        timeoutId=setTimeout(()=>{ if(finished||settled||token!==realLoadToken||requestToken!==playbackRequestToken)return; settled=true;cleanup();failAttempt('Przekroczono 12 s ładowania.'); },12000);
        log('Loading "'+track.title+'" attempt '+(attempt+1)+'/'+MAX_TRACK_LOAD_ATTEMPTS,'info');
      };
      runAttempt();
    });
  }

  async function playRealTrack(track){
    if(!realAudioEl) realAudioEl=mobileAudio;
    closeSongErrorModal(); state.failedTrack=null; state.failedTrackAttempts=0;
    const requestToken=playbackRequestToken;
    log('Playback request -> ['+state.currentIndex+'] '+track.title,'info');
    try{
      await loadRealTrackWithRetries(track,requestToken);
      if(track!==currentTrack()||!state.isPlaying||requestToken!==playbackRequestToken)return;
      realAudioEl.playbackRate=SPEED_RATES[state.speed];
      try{realAudioEl.preservesPitch=false;realAudioEl.mozPreservesPitch=false;realAudioEl.webkitPreservesPitch=false;}catch(e){}
      connectRealAudioOnce();
      await realAudioEl.play();
      updateMediaSession(track,true);
      log('Playing ['+state.currentIndex+'] '+track.title,'ok');
    }catch(err){
      if(track!==currentTrack()||requestToken!==playbackRequestToken)return;
      state.isPlaying=false; updatePlayIcon(); updateMediaSession(track,false);
      try{realAudioEl.pause();}catch(e){}
      log('Track failed after '+MAX_TRACK_LOAD_ATTEMPTS+' attempts: '+err.message,'err');
      showSongErrorModal(track,'Try again albo pomiń ten utwór.');
    }
  }

  function scheduleSynthFrom(track, unscaledOffset, rate){
    ensureAudioGraph();
    const notes = track.synth.notes.filter(n => n.start + n.dur > unscaledOffset);
    const startCtxTime = audioCtx.currentTime + 0.05;
    const activeOscillators = [];
    let t = startCtxTime;
    notes.forEach(n=>{
      const noteOffset = Math.max(0, unscaledOffset - n.start);
      const remainingUnscaled = n.dur - noteOffset;
      if(remainingUnscaled <= 0.01) return;
      const scaledDur = remainingUnscaled / rate;
      const osc = audioCtx.createOscillator();
      osc.type = track.synth.waveform;
      osc.frequency.value = n.freq * rate;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.14, t + Math.min(0.02, scaledDur/3));
      g.gain.linearRampToValueAtTime(0, t + scaledDur);
      osc.connect(g).connect(toneFilter);
      osc.start(t);
      osc.stop(t + scaledDur + 0.02);
      activeOscillators.push(osc);
      t += scaledDur;
    });
    const totalUnscaled = track.synth.totalUnscaled;
    const remainingScaledTotal = (totalUnscaled - unscaledOffset) / rate;

    synthState = {
      track, rate, startCtxTime,
      baseElapsedUnscaled: unscaledOffset,
      totalUnscaled, activeOscillators,
      endTimer: setTimeout(onTrackEnded, Math.max(50, remainingScaledTotal*1000)),
      rafId: null
    };
    tickSynthProgress();
  }

  function playSynthTrack(track){
    stopAllPlayback();
    ensureAudioGraph();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    scheduleSynthFrom(track, 0, SPEED_RATES[state.speed]);
    log('Playing: ' + track.title, 'ok');
  }

  function getSynthElapsedUnscaled(){
    if(!synthState) return 0;
    return synthState.baseElapsedUnscaled + (audioCtx.currentTime - synthState.startCtxTime) * synthState.rate;
  }

  function tickSynthProgress(){
    if(!synthState) return;
    const elapsed = getSynthElapsedUnscaled();
    const dur = synthState.totalUnscaled;
    updateProgressUI(Math.min(elapsed,dur) / synthState.rate, dur / synthState.rate);
    synthState.rafId = requestAnimationFrame(tickSynthProgress);
  }

  function currentTrack(){ return state.tracks[state.currentIndex]; }

  function playTrackAtIndex(i){
    if(i < 0 || i >= state.tracks.length) return;
    ensureAudioGraph();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    playbackRequestToken++;
    stopAllPlayback(false);
    state.currentIndex = i;
    state.isPlaying = true;
    const track = state.tracks[i];
    log('QUEUE SELECT [' + i + '/' + (state.tracks.length - 1) + '] ' + track.title + ' | mode=' + state.mode, 'info');
    renderNowPlaying();
    updatePlayingRowUI();
    applySpeedFX(state.speed);

    if(track.type === 'real'){ playRealTrack(track); }
    else { playSynthTrack(track); }
    updatePlayIcon();
  }

  function togglePlayPause(){
    if(state.currentIndex === -1){
      if(state.tracks.length) playTrackAtIndex(0);
      return;
    }
    ensureAudioGraph();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const track = currentTrack();
    if(state.isPlaying){
      state.isPlaying = false;
      if(track.type === 'real' && realAudioEl){ realAudioEl.pause(); }
      else if(audioCtx){ audioCtx.suspend(); }
      if('mediaSession' in navigator){ try { navigator.mediaSession.playbackState = 'paused'; } catch(e) {} }
      log('Paused.', 'info');
    } else {
      state.isPlaying = true;
      if(track.type === 'real' && realAudioEl){ realAudioEl.play().catch(()=>{}); }
      else if(audioCtx){ audioCtx.resume(); }
      if('mediaSession' in navigator){ try { navigator.mediaSession.playbackState = 'playing'; } catch(e) {} }
      log('Resumed.', 'info');
    }
    updatePlayIcon();
  }

  function pickNextShuffleIndex(){
    if(state.tracks.length <= 1) return state.currentIndex;
    let idx, tries = 0;
    do{ idx = Math.floor(Math.random() * state.tracks.length); tries++; }
    while(idx === state.currentIndex && tries < 10);
    return idx;
  }

  function onTrackEnded(){
    if(!state.tracks.length) return;
    log('ENDED idx=' + state.currentIndex + ' mode=' + state.mode, 'info');
    if(state.mode === 'loop'){ playTrackAtIndex(state.currentIndex); return; }
    if(state.mode === 'shuffle'){ playTrackAtIndex(pickNextShuffleIndex()); return; }
    playTrackAtIndex((state.currentIndex + 1) % state.tracks.length);
  }

  function nextTrack(){
    if(!state.tracks.length) return;
    if(state.mode === 'shuffle') playTrackAtIndex(pickNextShuffleIndex());
    else playTrackAtIndex((state.currentIndex + 1) % state.tracks.length);
  }
  function prevTrack(){
    if(!state.tracks.length) return;
    if(state.mode === 'shuffle') playTrackAtIndex(pickNextShuffleIndex());
    else playTrackAtIndex((state.currentIndex - 1 + state.tracks.length) % state.tracks.length);
  }

  function setSpeed(newSpeed){
    if(state.speed === newSpeed) return;
    state.speed = newSpeed;
    log('Speed: ' + newSpeed + ' (x' + SPEED_RATES[newSpeed] + ')', 'info');
    applySpeedFX(newSpeed);
    updateSpeedUI();

    const track = currentTrack();
    if(!track) return;

    if(track.type === 'real' && realAudioEl){
      realAudioEl.playbackRate = SPEED_RATES[newSpeed];
    } else if(track.type === 'synth' && synthState){
      const elapsed = getSynthElapsedUnscaled();
      synthState.activeOscillators.forEach(o => { try{ o.stop(); }catch(e){} });
      if(synthState.endTimer) clearTimeout(synthState.endTimer);
      if(synthState.rafId) cancelAnimationFrame(synthState.rafId);
      scheduleSynthFrom(track, elapsed, SPEED_RATES[newSpeed]);
    }
  }

  function seekToFraction(frac){
    const track = currentTrack();
    if(!track) return;
    frac = Math.min(1, Math.max(0, frac));
    if(track.type === 'real' && realAudioEl && isFinite(realAudioEl.duration)){
      realAudioEl.currentTime = frac * realAudioEl.duration;
    } else if(track.type === 'synth'){
      const unscaledTarget = frac * track.synth.totalUnscaled;
      const rate = synthState ? synthState.rate : SPEED_RATES[state.speed];
      if(synthState){
        synthState.activeOscillators.forEach(o => { try{ o.stop(); }catch(e){} });
        if(synthState.endTimer) clearTimeout(synthState.endTimer);
        if(synthState.rafId) cancelAnimationFrame(synthState.rafId);
      }
      scheduleSynthFrom(track, unscaledTarget, rate);
    }
  }

  /* =========================================================
     UI RENDERING
  ==========================================================*/
  const trackListEl = document.getElementById('trackList');
  const listSub = document.getElementById('listSub');

  function renderTrackList(filter){
    filter = (filter || '').toLowerCase().trim();
    trackListEl.innerHTML = '';
    const filtered = state.tracks
      .map((t, idx) => ({t, idx}))
      .filter(({t}) => !filter || t.title.toLowerCase().includes(filter));

    listSub.textContent = state.tracks.length ? (state.tracks.length + ' tracks') : '';

    if(!filtered.length){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = filter ? 'No results found.' : 'No tracks loaded.';
      trackListEl.appendChild(empty);
      return;
    }

    filtered.forEach(({t, idx}, renderIdx) => {
      const row = document.createElement('div');
      row.className = 'track-row' + (idx === state.currentIndex ? ' playing' : '');
      row.id = 'track-row-' + idx;
      
      let durText = '--:--';
      if(t.type === 'synth') durText = fmtTime(t.synth.totalUnscaled);
      else if(t.durationLoaded) durText = fmtTime(t.duration);

      row.innerHTML = `
        <div class="t-idx">
          <span class="num">${t.trackNum}</span>
          <span class="bars"><span></span><span></span><span></span></span>
        </div>
        <div class="t-meta">
          <div class="t-title">${escapeHtml(t.title)}</div>
        </div>
        <div class="t-dur">${durText}</div>
      `;
      row.addEventListener('click', () => playTrackAtIndex(idx));
      trackListEl.appendChild(row);
    });
  }

  function updatePlayingRowUI(){
    const rows = trackListEl.querySelectorAll('.track-row');
    rows.forEach(row => {
      const idx = Number(row.id.replace('track-row-', ''));
      const active = idx === state.currentIndex;
      row.classList.toggle('playing', active);
      const num = row.querySelector('.num');
      const bars = row.querySelector('.bars');
      if(num) num.style.display = active ? 'none' : '';
      if(bars) bars.style.display = active ? 'flex' : 'none';
    });
  }

  const pTitle = document.getElementById('pTitle');

  function renderNowPlaying(){
    const track = currentTrack();
    if(!track){
      pTitle.textContent = '—';
      return;
    }
    pTitle.textContent = track.title;
  }

  const playIcon = document.getElementById('playIcon');
  function updatePlayIcon(){
    if(state.isPlaying){
      playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    } else {
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  }

  const progressFill = document.getElementById('progressFill');
  const progressKnob = document.getElementById('progressKnob');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');

  function updateProgressUI(curSec, durSec){
    const pct = durSec > 0 ? Math.min(100, (curSec/durSec)*100) : 0;
    progressFill.style.width = pct + '%';
    progressKnob.style.left = pct + '%';
    curTimeEl.textContent = fmtTime(curSec);
    durTimeEl.textContent = fmtTime(durSec);
  }

  function attachRealAudioProgressHandler(){
    if(!realAudioEl || realAudioEl._progressAttached) return;
    realAudioEl._progressAttached = true;
    realAudioEl.addEventListener('timeupdate', () => {
      if(currentTrack() && currentTrack().type === 'real'){
        updateProgressUI(realAudioEl.currentTime, realAudioEl.duration || 0);
      }
    });
  }

  /* =========================================================
     SEGMENTED CONTROLS
  ==========================================================*/
  function setupSegmented(container, dataAttr, onSelect){
    const buttons = Array.from(container.querySelectorAll('button'));
    const highlight = container.querySelector('.seg-highlight');
    function place(btn){
      if(!btn || !highlight) return;
      highlight.style.width = btn.offsetWidth + 'px';
      highlight.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
    }
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        place(btn);
        onSelect(btn.getAttribute(dataAttr));
      });
    });
    requestAnimationFrame(() => place(container.querySelector('button.active') || buttons[0]));
    window.addEventListener('resize', () => place(container.querySelector('button.active')));
    return { buttons, place };
  }

  function syncSpeedButtons(speed){
    const label = document.getElementById('speedValue');
    if(label) label.textContent = speed.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join(' ');
    document.querySelectorAll('[data-speed-choice]').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-speed-choice') === speed);
    });
    progressFill.className = 'bar-fill ' + speed.replace('very-', '');
  }
  function updateSpeedUI(){ syncSpeedButtons(state.speed); }

  setupSegmented(document.getElementById('modeSeg'), 'data-mode', (mode) => {
    state.mode = mode;
    log('Mode: ' + mode, 'info');
  });

  /* =========================================================
     CONTROL BINDINGS
  ==========================================================*/
  document.getElementById('playBtn').addEventListener('click', togglePlayPause);
  document.getElementById('nextBtn').addEventListener('click', nextTrack);
  document.getElementById('prevBtn').addEventListener('click', prevTrack);

  const progressTrack = document.getElementById('progressTrack');
  let progressDragging = false, progressPointerId = null;
  function seekFromPointer(e){
    const r = progressTrack.getBoundingClientRect();
    seekToFraction((e.clientX-r.left)/Math.max(1,r.width));
  }
  progressTrack.addEventListener('pointerdown', e => {
    progressDragging = true; progressPointerId = e.pointerId;
    try{progressTrack.setPointerCapture(e.pointerId);}catch(_){}
    seekFromPointer(e); e.preventDefault();
  });
  progressTrack.addEventListener('pointermove', e => { if(progressDragging && e.pointerId===progressPointerId){ seekFromPointer(e); e.preventDefault(); } });
  const endDrag = e => { if(e.pointerId!==progressPointerId) return; progressDragging=false; try{progressTrack.releasePointerCapture(e.pointerId);}catch(_){} progressPointerId=null; };
  progressTrack.addEventListener('pointerup', endDrag);
  progressTrack.addEventListener('pointercancel', endDrag);

  document.getElementById('searchInput').addEventListener('input', (e) => renderTrackList(e.target.value));
  const speedModal = document.getElementById('speedModal');
  const sourceModal = document.getElementById('sourceModal');
  const songErrorModal = document.getElementById('songErrorModal');
  let pendingSpeed = state.speed;
  const openModal = el => el && el.classList.add('active');
  const closeModal = el => el && el.classList.remove('active');

  document.getElementById('songRetryBtn').addEventListener('click', () => {
    const track = state.failedTrack;
    if(!track) return;
    closeSongErrorModal();
    const idx = state.tracks.indexOf(track);
    if(idx < 0) return;
    playTrackAtIndex(idx);
  });

  document.getElementById('songSkipBtn').addEventListener('click', () => {
    closeSongErrorModal();
    const failedIndex = state.currentIndex;
    state.failedTrack = null;
    state.failedTrackAttempts = 0;
    if(!state.tracks.length) return;
    let nextIndex;
    if(state.mode === 'shuffle') nextIndex = pickNextShuffleIndex();
    else nextIndex = (failedIndex + 1) % state.tracks.length;
    playTrackAtIndex(nextIndex);
  });

  songErrorModal.addEventListener('click', (e) => {
    if(e.target === songErrorModal) closeSongErrorModal();
  });

  document.getElementById('speedBtn').addEventListener('click', () => {
    pendingSpeed = state.speed;
    syncSpeedButtons(pendingSpeed);
    openModal(speedModal);
  });
  document.querySelectorAll('[data-speed-choice]').forEach(btn => {
    btn.addEventListener('click', () => {
      pendingSpeed = btn.getAttribute('data-speed-choice');
      document.querySelectorAll('[data-speed-choice]').forEach(b => b.classList.toggle('active', b === btn));
    });
  });
  document.getElementById('speedConfirm').addEventListener('click', () => {
    setSpeed(pendingSpeed);
    closeModal(speedModal);
  });
  document.getElementById('sourceBtn').addEventListener('click', () => openModal(sourceModal));
  document.getElementById('sourceConfirm').addEventListener('click', () => {
    const owner = document.getElementById('repoOwner').value.trim() || 'officialfabex';
    const repo = document.getElementById('repoName').value.trim() || 'music';
    document.getElementById('repoOwner').value = owner;
    document.getElementById('repoName').value = repo;
    closeModal(sourceModal);
    loadLibrary(true);
  });
  document.querySelectorAll('[data-close-modal]').forEach(btn => {
    btn.addEventListener('click', () => closeModal(document.getElementById(btn.getAttribute('data-close-modal'))));
  });
  [speedModal, sourceModal].forEach(modal => modal.addEventListener('click', e => { if(e.target === modal) closeModal(modal); }));

  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space' && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault();
      togglePlayPause();
    }
  });

  /* Progress listener is attached directly to the persistent mobile audio element. */

  if('mediaSession' in navigator){
    const setHandler = (action, handler) => { try { navigator.mediaSession.setActionHandler(action, handler); } catch(e) {} };
    setHandler('play', () => { if(!state.isPlaying) togglePlayPause(); });
    setHandler('pause', () => { if(state.isPlaying) togglePlayPause(); });
    setHandler('nexttrack', nextTrack);
    setHandler('previoustrack', prevTrack);
  }

  /* =========================================================
     LIBRARY LOADING
  ==========================================================*/
  function cacheKey(owner,repo){ return 'piratesound.trackCache:'+owner+'/'+repo; }
  function saveTrackCache(owner,repo,tracks){ try{localStorage.setItem(cacheKey(owner,repo),JSON.stringify(tracks));}catch(e){} }
  function readTrackCache(owner,repo){ try{return JSON.parse(localStorage.getItem(cacheKey(owner,repo))||'null');}catch(e){return null;} }

  async function loadLibrary(isRefetch){
    const owner=document.getElementById('repoOwner').value.trim();
    const repo=document.getElementById('repoName').value.trim();
    if(!owner||!repo){ log('GitHub Repository is empty.','info'); return; }
    try{localStorage.setItem('piratesound.githubOwner',owner);localStorage.setItem('piratesound.githubRepo',repo);}catch(e){}

    if(!state.tracks.length){
      const cached=readTrackCache(owner,repo);
      if(cached&&cached.length){
        state.tracks=cached; applyCachedDurations(owner, repo, state.tracks); state.currentIndex=-1; state.isPlaying=false;
        renderTrackList(document.getElementById('searchInput').value); renderNowPlaying(); updatePlayIcon();
        log('Instant library from cache: '+cached.length+' tracks.','ok');
      }
    }

    log((isRefetch?'Refreshing':'Loading')+': '+owner+'/'+repo,'info');
    try{
      const tracks=await fetchGithubTracks(owner,repo);
      const old=currentTrack();
      saveTrackCache(owner,repo,tracks);
      state.tracks=tracks;
      applyCachedDurations(owner, repo, state.tracks);
      state.currentIndex=old&&old.url?tracks.findIndex(t=>t.url===old.url):-1;
      renderTrackList(document.getElementById('searchInput').value); renderNowPlaying(); updatePlayIcon();
      log('GitHub refresh complete: '+tracks.length+' tracks.','ok');
    }catch(e){
      log('GitHub refresh failed: '+e.message,'warn');
      if(!state.tracks.length){renderTrackList(document.getElementById('searchInput').value);renderNowPlaying();updatePlayIcon();}
      else log('Keeping current library; no UI reset.','info');
    }

    // Durations are visible from cache immediately; any missing ones load all at once.
    loadAllDurations(owner, repo).catch(e => log('Duration scan failed: ' + e.message, 'warn'));

    try{
      const lastUrl=localStorage.getItem('piratesound.lastUrl')||'';
      const lastIndex=parseInt(localStorage.getItem('piratesound.lastTrack')||'-1',10);
      const idx=lastUrl?state.tracks.findIndex(t=>t.url===lastUrl):lastIndex;
      if(idx>=0&&idx<state.tracks.length&&state.currentIndex===-1){state.currentIndex=idx;state.isPlaying=false;renderNowPlaying();updatePlayingRowUI();}
    }catch(e){}
  }

  /* =========================================================
     RESTORE SAVED GITHUB REPOSITORY
  ==========================================================*/
  (function restoreSavedRepository(){
    try{
      const savedOwner = localStorage.getItem('piratesound.githubOwner') || '';
      const savedRepo = localStorage.getItem('piratesound.githubRepo') || '';
      document.getElementById('repoOwner').value = savedOwner;
      document.getElementById('repoName').value = savedRepo;
    }catch(e){}
  })();

  /* =========================================================
     INIT
  ==========================================================*/
  updateSpeedUI();
  loadLibrary(false);
  log('Ready.', 'info');
})();
</script>
</body>
</html>
